<!DOCTYPE html>
<html>
<head>
  <title>Tic Tac Toe</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    #board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; justify-content: center; }
    .cell { width: 100px; height: 100px; font-size: 40px; display: flex; align-items: center; justify-content: center; border: 2px solid #333; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe (real-time test)</h1>
  <div id="board"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const board = document.getElementById('board');
    const status = document.createElement('p');
    document.body.insertBefore(status, board);
    const cells = [];
    let mySymbol = null;

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.classList.add('cell');
      cell.addEventListener('click', () => {
        socket.emit('move', i);
      });
      board.appendChild(cell);
      cells.push(cell);
    }

    socket.on('assignSymbol', (symbol) => {
      mySymbol = symbol;
      status.textContent = symbol === 'spectator'
        ? 'You are spectating.'
        : `You are ${symbol}.`;
    });

    socket.on('gameState', ({ board: newBoard, currentTurn, gameOver, winner }) => {
      newBoard.forEach((val, i) => {
        cells[i].textContent = val || '';
      });

      if (gameOver) {
        status.textContent = winner ? `${winner} wins!` : "It's a draw!";
      } else if (mySymbol && mySymbol !== 'spectator') {
        status.textContent = currentTurn === mySymbol ? 'Your turn' : "Opponent's turn";
      }
    });
  </script>
</body>
</html>
